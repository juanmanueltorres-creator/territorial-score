name: EO source probe

on:
  pull_request:
    paths:
      - ".github/workflows/eo-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Probe GeoPlatform Sentinel source
    if: github.head_ref == 'feat/v0.2-satellite-context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production GeoPlatform EO endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://geo-platform.onrender.com/api/v1/gee/sentinel2"
          bbox = "-69.8261033,-30.3812853,-69.224662,-30.1928818"

          def get(path, params):
              url = f"{base}/{path}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "territorial-score-eo-probe/0.2"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {"detail": raw[:500]}
                  return exc.code, payload

          scene_status, scene_payload = get("scenes", {"study_area_bbox": bbox})
          print("SCENES_STATUS", scene_status)
          scenes = scene_payload.get("scenes", []) if isinstance(scene_payload, dict) else []
          print("SCENES_AVAILABLE", bool(scene_payload.get("available")) if isinstance(scene_payload, dict) else False)
          print("SCENES_COUNT", len(scenes))
          if not scenes:
              print("SCENES_DETAIL", json.dumps(scene_payload, sort_keys=True)[:1200])
              raise SystemExit(2)

          scene = scenes[0]
          scene_id = scene.get("scene_id")
          print("SCENE_ID", scene_id)
          print("SCENE_DATE", scene.get("date"))
          print("SCENE_CLOUD_PERCENT", scene.get("cloud_percent"))
          print("SCENE_PLATFORM", scene.get("platform"))
          print("SCENE_SOURCE", scene.get("source"))

          for product in ("ndvi", "ndwi", "ndsi"):
              status, payload = get("product/stats", {
                  "study_area_bbox": bbox,
                  "product": product,
                  "scene_id": scene_id,
              })
              print(f"{product.upper()}_STATUS", status)
              print(f"{product.upper()}_AVAILABLE", bool(payload.get("available")) if isinstance(payload, dict) else False)
              print(f"{product.upper()}_HAS_STATS", bool(payload.get("stats")) if isinstance(payload, dict) else False)
              if status >= 400:
                  print(f"{product.upper()}_DETAIL", json.dumps(payload, sort_keys=True)[:600])

          rgb_status, rgb_payload = get("product/tiles", {
              "study_area_bbox": bbox,
              "product": "rgb",
              "scene_id": scene_id,
          })
          print("RGB_STATUS", rgb_status)
          print("RGB_AVAILABLE", bool(rgb_payload.get("available")) if isinstance(rgb_payload, dict) else False)
          print("RGB_HAS_TILE_URL", bool(rgb_payload.get("tile_url")) if isinstance(rgb_payload, dict) else False)
          if rgb_status >= 400:
              print("RGB_DETAIL", json.dumps(rgb_payload, sort_keys=True)[:600])
          PY
