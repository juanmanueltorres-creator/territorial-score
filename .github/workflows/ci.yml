name: CI

on:
  push:
    branches:
      - main
      - feat/v0-foundation
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  mobility-benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install experiment dependencies
        run: python -m pip install -e "experiments/mobility-anomaly[dev]"

      - name: Benchmark tests
        run: python -m pytest experiments/mobility-anomaly/tests -q
