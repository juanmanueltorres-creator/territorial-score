[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "territorial-score-mobility-anomaly"
version = "0.1.0"
description = "Deterministic synthetic mobility benchmark for Territorial Score"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["territorial_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
